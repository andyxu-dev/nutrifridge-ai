[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
files = [
    "backend/app/services/unit_converter.py",
    "backend/app/services/nutrition_engine.py",
    "backend/app/services/expiration_engine.py",
    "backend/app/services/health_constraint_engine.py",
]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
pretty = true
